<style>
:root {
  --page-bg-1: #ede2cd;
  --page-bg-2: #cdb27e;
  --card-bg: #fbf6ec;
  --ink: #34281a;
  --ink-soft: #8a7458;
  --line: #e6d9bd;
  --board-1: #e8cf9c;
  --board-2: #c79f5e;
  --black-1: #5a5a5a;
  --black-2: #0a0a0a;
  --white-1: #ffffff;
  --white-2: #d9d9d9;
  --accent: #a8471f;
  --accent-soft: #f3ded0;
  --active-glow: 0 0 0 3px var(--accent-soft), 0 8px 20px -8px rgba(168, 71, 31, 0.45);
  --good: #22c55e;
  --warn: #f59e0b;
  --bad: #ef4444;
  --radius-lg: 22px;
  --radius-md: 14px;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.5), transparent 55%),
    linear-gradient(160deg, var(--page-bg-1), var(--page-bg-2) 85%);
  min-height: 100vh;
}

.page {
  display: flex;
  justify-content: center;
  padding: 32px 14px 48px;
}

.card {
  width: 100%;
  max-width: 620px;
  background:
    repeating-linear-gradient(178deg, rgba(74, 51, 26, 0.02) 0px, rgba(74, 51, 26, 0.02) 1px, transparent 1px, transparent 5px),
    var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px -24px rgba(58, 44, 26, 0.35), 0 2px 8px rgba(58, 44, 26, 0.06);
  padding: 28px 22px 22px;
  border: 1px solid rgba(74, 51, 26, 0.08);
}

.header { text-align: center; margin-bottom: 14px; }
.header h1 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
}
.header h1 .en {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-left: 6px;
}

.rules {
  margin: 0 auto;
  max-width: 480px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-soft);
}
.rules strong { color: var(--accent); }

/* 방 설정 패널 */
.room-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  margin-bottom: 14px;
  background: #f1ebd9;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--ink-soft);
}
.room-input {
  width: 110px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  text-align: center;
  font-weight: bold;
  text-transform: uppercase;
}
.room-msg {
  font-size: 12px;
  color: var(--accent);
  font-weight: bold;
}

.scoreboard {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.panel {
  flex: 1;
  background: #f7f3ea;
  border-radius: var(--radius-md);
  padding: 10px;
  text-align: center;
  border: 1px solid var(--line);
  transition: all 0.25s ease;
}
.panel.active {
  background: #fffaf0;
  box-shadow: var(--active-glow);
  transform: translateY(-2px);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink-soft);
}
.panel.active .panel-head { color: var(--ink); }

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.dot-black { background: radial-gradient(circle at 35% 30%, #6a6a6a, #0a0a0a 70%); }
.dot-white { background: radial-gradient(circle at 35% 30%, #ffffff, #d5d5d5 70%); }

.status {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  min-height: 18px;
}
.panel.active .status { color: var(--accent); }

.board-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: 0 10px 24px -14px rgba(58, 44, 26, 0.5);
}

canvas#board {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, var(--board-1), var(--board-2));
  cursor: pointer;
  touch-action: manipulation;
}

.btn {
  appearance: none;
  border: 1px solid rgba(74, 51, 26, 0.15);
  cursor: pointer;
  background: var(--card-bg);
  color: var(--ink);
  font-weight: 700;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 999px;
  transition: all 0.2s ease;
}
.btn:hover { background: var(--accent-soft); border-color: rgba(168, 71, 31, 0.3); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #7c3413);
  border-color: transparent;
  color: #fff;
}
.btn-primary:hover { background: linear-gradient(135deg, #c25a2c, var(--accent)); }

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(30, 22, 10, 0.5);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }

.overlay-box {
  background: #fffdf8;
  border-radius: var(--radius-md);
  padding: 24px 30px;
  text-align: center;
  box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4);
}
.overlay-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
</style>

<div class="page">
  <div class="card">
    <header class="header">
      <h1>육목 온라인 <span class="en">Connect 6</span></h1>
      <p class="rules">
        첫 수 <strong>1개</strong>, 이후 <strong>2개씩</strong> 번갈아 놓아 <strong>6개</strong>를 먼저 이으면 승리!
      </p>
    </header>

    <!-- 온라인 방 만들기 UI -->
    <div class="room-bar" id="room-controls">
      <button class="btn btn-primary" id="btn-create-room">방 만들기</button>
      <span>또는</span>
      <input type="text" id="room-code-input" class="room-input" placeholder="방 코드" maxlength="5">
      <button class="btn" id="btn-join-room">참여</button>
    </div>
    <div style="text-align:center; margin-bottom: 10px;">
      <span class="room-msg" id="room-status-text">방을 만들거나 상대방의 코드를 입력하세요.</span>
    </div>

    <section class="scoreboard">
      <div class="panel" id="panel-black">
        <div class="panel-head">
          <span class="dot dot-black"></span>
          <span id="label-black">흑돌 (방장)</span>
        </div>
        <div class="status" id="status-black">대기 중</div>
      </div>

      <div class="panel" id="panel-white">
        <div class="panel-head">
          <span class="dot dot-white"></span>
          <span id="label-white">백돌 (참여자)</span>
        </div>
        <div class="status" id="status-white">대기 중</div>
      </div>
    </section>

    <section class="board-wrap" id="board-wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-box">
          <div class="overlay-title" id="overlay-title">게임 종료</div>
          <button class="btn btn-primary" id="overlay-restart">새 방 만들기</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  "use strict";

  // --- Firebase 설정 ---
  const firebaseConfig = {
    apiKey: "AIzaSyDw0p2uhVWe-KSdm9vLjp8b6hxtTpZHX_U",
    authDomain: "online-variant-game.firebaseapp.com",
    databaseURL: "https://online-variant-game-default-rtdb.firebaseio.com",
    projectId: "online-variant-game",
    storageBucket: "online-variant-game.firebasestorage.app",
    messagingSenderId: "257827695949",
    appId: "1:257827695949:web:cf1aeeaf481be832c61b04"
    measurementId: "G-2D7FWZDRQJ"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // --- 게임 상수 ---
  const BOARD_SIZE = 19;
  const WIN_CONDITION = 6;
  const EMPTY = 0, BLACK = 1, WHITE = 2;

  // --- DOM ---
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const boardWrap = document.getElementById("board-wrap");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayRestart = document.getElementById("overlay-restart");
  const roomCodeInput = document.getElementById("room-code-input");
  const roomStatusText = document.getElementById("room-status-text");
  const btnCreateRoom = document.getElementById("btn-create-room");
  const btnJoinRoom = document.getElementById("btn-join-room");

  const panels = { [BLACK]: document.getElementById("panel-black"), [WHITE]: document.getElementById("panel-white") };
  const statusEls = { [BLACK]: document.getElementById("status-black"), [WHITE]: document.getElementById("status-white") };

  // --- 상태 변수 ---
  let cssSize = 0, padding = 0, cellSize = 0;
  let board = [];
  let currentPlayer = BLACK;
  let stonesToPlace = 1;
  let lastMoves = [];
  let gameOver = false;
  let hoverCell = null;

  // 온라인 상태
  let currentRoomId = null;
  let myRole = null; // BLACK(1) 방장, WHITE(2) 참가자
  let roomRef = null;

  function initBoardArray() {
    board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    cssSize = boardWrap.clientWidth;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    padding = cssSize * 0.03 + (cssSize / (BOARD_SIZE - 1)) * 0.5;
    cellSize = (cssSize - padding * 2) / (BOARD_SIZE - 1);
    render();
  }

  function cellCenter(row, col) {
    return { x: padding + col * cellSize, y: padding + row * cellSize };
  }

  function pointToCell(x, y) {
    const col = Math.round((x - padding) / cellSize);
    const row = Math.round((y - padding) / cellSize);
    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return null;
    const { x: cx, y: cy } = cellCenter(row, col);
    if (Math.hypot(x - cx, y - cy) > cellSize * 0.55) return null;
    return { row, col };
  }

  // --- 렌더링 ---
  function render() {
    ctx.clearRect(0, 0, cssSize, cssSize);
    drawGrid();
    drawStarPoints();
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if (board[r][c] !== EMPTY) drawStone(r, c, board[r][c]);
      }
    }
    drawLastMoveMarker();
    drawHoverGhost();
  }

  function drawGrid() {
    ctx.strokeStyle = "rgba(91, 64, 37, 0.55)";
    ctx.lineWidth = 1;
    const start = padding;
    const end = padding + (BOARD_SIZE - 1) * cellSize;
    for (let i = 0; i < BOARD_SIZE; i++) {
      const pos = padding + i * cellSize;
      ctx.beginPath(); ctx.moveTo(pos, start); ctx.lineTo(pos, end); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(start, pos); ctx.lineTo(end, pos); ctx.stroke();
    }
  }

  function drawStarPoints() {
    const pts = [3, 9, 15];
    ctx.fillStyle = "rgba(91, 64, 37, 0.65)";
    for (const r of pts) {
      for (const c of pts) {
        const { x, y } = cellCenter(r, c);
        ctx.beginPath();
        ctx.arc(x, y, Math.max(2, cellSize * 0.08), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawStone(row, col, player) {
    const { x, y } = cellCenter(row, col);
    const r = cellSize * 0.42;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x + r * 0.15, y + r * 0.22, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fill();

    const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
    if (player === BLACK) {
      grad.addColorStop(0, "#6b6b6b"); grad.addColorStop(1, "#050505");
    } else {
      grad.addColorStop(0, "#ffffff"); grad.addColorStop(1, "#cfcfcf");
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    if (player === WHITE) {
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLastMoveMarker() {
    if (!lastMoves.length) return;
    const { row, col } = lastMoves[lastMoves.length - 1];
    const { x, y } = cellCenter(row, col);
    ctx.beginPath();
    ctx.arc(x, y, Math.max(2.5, cellSize * 0.1), 0, Math.PI * 2);
    ctx.fillStyle = "#e63946";
    ctx.fill();
  }

  function drawHoverGhost() {
    if (gameOver || !hoverCell || currentPlayer !== myRole) return;
    const { row, col } = hoverCell;
    if (board[row][col] !== EMPTY) return;
    const { x, y } = cellCenter(row, col);
    const r = cellSize * 0.42;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = myRole === BLACK ? "rgba(10,10,10,0.65)" : "rgba(120,120,120,0.85)";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // --- 이벤트 핸들링 ---
  function eventToBoardXY(evt) {
    const rect = canvas.getBoundingClientRect();
    const point = evt.touches ? evt.touches[0] : evt;
    const scale = cssSize / rect.width;
    return {
      x: (point.clientX - rect.left) * scale,
      y: (point.clientY - rect.top) * scale,
    };
  }

  function handleMove(evt) {
    if (gameOver || !currentRoomId) return;
    const { x, y } = eventToBoardXY(evt);
    hoverCell = pointToCell(x, y);
    render();
  }

  function handleClick(evt) {
    if (gameOver || !currentRoomId) return;
    if (currentPlayer !== myRole) return; // 내 턴이 아닐 때 방지

    const { x, y } = eventToBoardXY(evt);
    const cell = pointToCell(x, y);
    if (!cell || board[cell.row][cell.col] !== EMPTY) return;

    // Firebase에 착수 데이터 전송
    const nextStones = stonesToPlace - 1;
    let nextPlayer = currentPlayer;
    let newStonesToPlace = nextStones;

    if (nextStones === 0) {
      nextPlayer = currentPlayer === BLACK ? WHITE : BLACK;
      newStonesToPlace = 2;
    }

    roomRef.update({
      lastMove: { row: cell.row, col: cell.col, player: myRole },
      currentPlayer: nextPlayer,
      stonesToPlace: newStonesToPlace
    });
  }

  // --- 방 생성 및 참여 로직 ---
  function createRoom() {
    const roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
    currentRoomId = roomId;
    myRole = BLACK;

    roomRef = db.ref('rooms/' + roomId);
    roomRef.set({
      createdAt: Date.now(),
      status: 'waiting',
      currentPlayer: BLACK,
      stonesToPlace: 1,
      lastMove: null
    });

    listenToRoom();
    roomStatusText.textContent = `방 코드: [ ${roomId} ] 상대방에게 코드를 공유하세요!`;
    document.getElementById('label-black').textContent = "흑돌 (나)";
    document.getElementById('label-white').textContent = "백돌 (상대)";
    initGame();
  }

  function joinRoom() {
    const code = roomCodeInput.value.trim().toUpperCase();
    if (!code) { alert('방 코드를 입력하세요.'); return; }

    currentRoomId = code;
    myRole = WHITE;
    roomRef = db.ref('rooms/' + code);

    roomRef.once('value', snapshot => {
      if (!snapshot.exists()) {
        alert('존재하지 않는 방 번호입니다.');
        return;
      }
      roomRef.update({ status: 'playing' });
      listenToRoom();
      roomStatusText.textContent = `[ ${code} ] 방에 입장했습니다! 게임을 시작합니다.`;
      document.getElementById('label-black').textContent = "흑돌 (상대)";
      document.getElementById('label-white').textContent = "백돌 (나)";
      initGame();
    });
  }

  function listenToRoom() {
    roomRef.on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return;

      if (data.status === 'playing' && myRole === BLACK) {
        roomStatusText.textContent = `상대방이 입장했습니다! (방 코드: ${currentRoomId})`;
      }

      if (data.lastMove) {
        const { row, col, player } = data.lastMove;
        if (board[row][col] === EMPTY) {
          board[row][col] = player;
          lastMoves.push({ row, col });
          render();

          if (checkWin(row, col)) {
            finishGame(player === myRole ? "승리하셨습니다! 🎉" : "패배하였습니다 😭");
            return;
          }
        }
      }

      currentPlayer = data.currentPlayer;
      stonesToPlace = data.stonesToPlace;
      updatePanels();
      render();
    });
  }

  function checkWin(row, col) {
    const stone = board[row][col];
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (let i = 1; i < WIN_CONDITION; i++) {
        const r = row + dr * i, c = col + dc * i;
        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === stone) count++;
        else break;
      }
      for (let i = 1; i < WIN_CONDITION; i++) {
        const r = row - dr * i, c = col - dc * i;
        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === stone) count++;
        else break;
      }
      if (count >= WIN_CONDITION) return true;
    }
    return false;
  }

  function updatePanels() {
    for (const p of [BLACK, WHITE]) {
      const isActive = p === currentPlayer && !gameOver;
      panels[p].classList.toggle("active", isActive);
      statusEls[p].textContent = gameOver
        ? "-"
        : isActive
        ? `놓을 돌 ${stonesToPlace}개`
        : "대기 중";
    }
  }

  function finishGame(message) {
    gameOver = true;
    updatePanels();
    overlayTitle.textContent = message;
    overlay.classList.add("show");
  }

  function initGame() {
    initBoardArray();
    lastMoves = [];
    gameOver = false;
    hoverCell = null;
    overlay.classList.remove("show");
    updatePanels();
    render();
  }

  // --- 이벤트 연결 ---
  canvas.addEventListener("mousemove", handleMove);
  canvas.addEventListener("mouseleave", () => { hoverCell = null; render(); });
  canvas.addEventListener("click", handleClick);
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
  canvas.addEventListener("touchend", (e) => { e.preventDefault(); handleClick(e); }, { passive: false });

  btnCreateRoom.addEventListener("click", createRoom);
  btnJoinRoom.addEventListener("click", joinRoom);
  overlayRestart.addEventListener("click", () => {
    overlay.classList.remove("show");
    createRoom();
  });

  window.addEventListener("resize", resizeCanvas);

  initBoardArray();
  resizeCanvas();
})();
</script>
